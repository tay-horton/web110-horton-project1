<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="icon" href="images/favicon.png">
    <link rel="stylesheet" href="styles.css">

    <title>Bono App | Sign Up</title>
</head>

<body>

    <div class="wrapper">

        <header class="header">
            <a href="index.html">
                <img src="images/logo.svg" alt="Bono logo" class="logo">
            </a>

            <div class="header-right">
                <div>
                    <i class="fa-solid fa-envelope"></i>
                    contact@bono.com
                </div>

                <div>
                    <i class="fa-solid fa-phone"></i>
                    (+31) 021-800-8244
                </div>

                <a href="#">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </div>
        </header>

        <main class="main-content">

            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message"></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>

            <div class="text-container">
                <h1>Coming Soon For Every Developer</h1>
                <p>
                    Bono is a new web app designed to make content management
                    simpler so developers can focus on what matters most.
                    Use the form to share your thoughts.
                </p>
            </div>

        </main>

    </div>

</body>
</html>
